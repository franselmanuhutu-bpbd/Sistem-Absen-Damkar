name: CI & Auto Release

on:
  push:
    branches: ["main", "master"]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/ci.yml'
      - 'vercel.json'
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force build & release the desktop even if the version already exists'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==========================================
  # JOB 1: Deploy Web / API to Vercel
  # ==========================================
  deploy-to-vercel:
    name: Deploy Web to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trigger Vercel Redeployment via Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [[ -z "$VERCEL_DEPLOY_HOOK" ]]; then
            echo "Notice: VERCEL_DEPLOY_HOOK is not congured yet on GitHub Secrets."
            exit 0
          fi

          echo "Triggering Vercel deployment..."
          HOOK_URL="${VERCEL_DEPLOY_HOOK}"
          if [[ "$HOOK_URL" == *"?"* ]]; then
            HOOK_URL="${HOOK_URL}&buildCache=false"
          else
            HOOK_URL="${HOOK_URL}?buildCache=false"
          fi
          curl --fail-with-body -sS -X POST "$HOOK_URL"

  # ==========================================
  # JOB 2: Build & Auto Release Desktop App
  # Runs automatically when tauri version changed inside tauri.conf.json
  # ==========================================
  release-desktop:
    name: Build & Release Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect Tauro Version Changes
        id: version_check
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          echo "Target Desktop Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          TAG_EXISTS=false
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q "v$VERSION"; then
            TAG_EXISTS=true
          fi

          FORCE="${{ inputs.force_release }}"

          if [ "$TAG_EXISTS" = "false" ] || [ "$FORCE" = "true" ]; then
            echo "Tag v$VERSION belum ada di GitHub (atau force_release aktif). Memulai build release..."
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v$VERSION sudah ada di GitHub Release. Melewati proses build desktop untuk menghemat waktu."
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Bun Environment
        if: steps.version_check.outputs.should_release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust Toolchain
        if: steps.version_check.outputs.should_release == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo & Rust
        if: steps.version_check.outputs.should_release == 'true'
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./frontend/src-tauri"

      - name: Install Frontend Dependencies
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./frontend
        run: bun install

      - name: Build & Sign Desktop App
        if: steps.version_check.outputs.should_release == 'true'
        working-directory: ./frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: bun run tauri:build:signed

      - name: Publish GitHub Release (Tag & Assets)
        if: steps.version_check.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version_check.outputs.version }}
          name: Damkar Absensi v${{ steps.version_check.outputs.version }}
          body: |
            ### Pembaruan Sistem Informasi Absensi DAMKAR Mimika v${{ steps.version_check.outputs.version }}
            Rilis otomatis oleh GitHub Actions CI/CD.

            #### Berkas Instalasi:
            * Unduh installer Windows (`-setup.exe`) di bawah ini.
            * Pengguna aplikasi versi sebelumnya akan menerima notifikasi update otomatis.
          draft: false
          prerelease: false
          files: |
            frontend/src-tauri/target/release/bundle/nsis/Damkar.Absensi_${{ steps.version_check.outputs.version }}_x64-setup.exe
            frontend/src-tauri/target/release/bundle/nsis/Damkar.Absensi_${{ steps.version_check.outputs.version }}_x64-setup.exe.sig
            frontend/src-tauri/target/release/bundle/nsis/latest.json

  android-release:
    name: Build Android APK
    needs: release-desktop
    if: needs.release-desktop.result != 'failure' && needs.release-desktop.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Application Version
        id: version
        shell: bash
        run: echo "version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.14206865"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build Android APK
        working-directory: ./frontend
        run: bun run tauri:android:build

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/damkar-release.keystore"

      - name: Sign Android APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          APK_DIR="frontend/src-tauri/gen/android/app/build/outputs/apk/universal/release"
          UNSIGNED_APK="$APK_DIR/app-universal-release-unsigned.apk"
          ALIGNED_APK="$APK_DIR/damkar-absensi-aligned.apk"
          SIGNED_APK="$APK_DIR/Damkar-Absensi.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/damkar-release.keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$APKSIGNER" verify --verbose "$SIGNED_APK"

      - name: Upload Android APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            frontend/src-tauri/gen/android/app/build/outputs/apk/universal/release/Damkar-Absensi.apk \
            --clobber
